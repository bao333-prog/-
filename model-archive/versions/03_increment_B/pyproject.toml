[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oven-food-proxy"
version = "0.1.0"
description = "Proxy-environment food classification workflow for a target oven"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "Pillow>=9.5",
  "torch>=2.2",
  "torchvision>=0.17",
]

[project.optional-dependencies]
video = ["opencv-python-headless>=4.9"]

[project.scripts]
oven-food = "oven_food.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

